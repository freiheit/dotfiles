[".local/share/liquidprompt"]
    type = "git-repo"
    url = "https://github.com/liquidprompt/liquidprompt.git"
    refreshPeriod = "24h"
    [".local/share/liquidprompt".clone]
        args = ["--branch", "stable"]
    [".local/share/liquidprompt".pull]
        args = ["--ff-only"]

[".local/share/liquidprompt-powerline"]
    type = "git-repo"
    url = "https://github.com/freiheit/liquidprompt-powerline.git"
    refreshPeriod = "24h"
    [".local/share/liquidprompt-powerline".pull]
        args = ["--ff-only"]

# ble.sh: prebuilt nightly tarball. The git repo ships no built ble.sh -- it is
# generated by make into out/ble.sh -- so use upstream's release archive, which
# also carries contrib/integration/fzf-*.bash. Not "exact", so ble.sh's runtime
# cache.d/ and run/ contents survive chezmoi apply.
[".local/share/blesh"]
    type = "archive"
    url = "https://github.com/akinomyoga/ble.sh/releases/download/nightly/ble-nightly.tar.xz"
    stripComponents = 1
    refreshPeriod = "168h"
