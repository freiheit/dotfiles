# Steam's steamrt3c client (2026-10) runs inside a pressure-vessel container
# with its own /var, so the Slow library (~/Slow -> /var/slow/eric) dangled and
# Steam logged "Install folder /var/home/eric/Slow not mounted". Share the
# host mount into every pressure-vessel container (client and games).
PRESSURE_VESSEL_FILESYSTEMS_RW=/var/slow
