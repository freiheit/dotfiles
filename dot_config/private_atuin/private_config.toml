## Only the settings that differ from atuin's defaults. The full annotated
## template is upstream: https://github.com/atuinsh/atuin/blob/main/crates/atuin-client/config.toml
## and `atuin` regenerates it if this file is deleted.

## Hitting enter runs the command immediately; tab returns to the shell to edit.
enter_accept = true

[sync]
## Sync v2. Default only for new installs, so it has to be set explicitly here.
records = true
