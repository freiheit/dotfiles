# EPOS H3PRO dongle: its analog-stereo profile (ALSA front:N) floods
# "snd_pcm_avail after recover: Broken pipe" and plays nothing until PipeWire
# restarts; iec958-stereo on the same hardware is clean (monolith, 2026-10-06
# to 10-08). A profile WirePlumber has stored for the card still wins over
# this, so this covers a fresh state or a forgotten one.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Sennheiser_EPOS_H3PRO_Dongle*" }
    ]
    actions = {
      update-props = {
        priorities = [
          "output:iec958-stereo+input:mono-fallback"
          "output:iec958-stereo"
        ]
      }
    }
  }
]
